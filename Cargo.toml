[package]
name = "xsg-engine"
version = "0.1.0-beta.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "xsg-engine"
path = "engine/src/main.rs"

[dependencies]
anyhow = "1"
hound = "3.5"
ptts = { git = "https://github.com/gradium-ai/xn-ptts", rev = "5f9522b3e245846d312caaeb460d3dcae5d1a991", default-features = false, features = ["hf"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell_Common"] }
